<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير لون محدد في الصورة</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: white;
            color: black;
        }
        .preview-image {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-gray-800 rounded-xl shadow-lg p-6">
        <!-- منطقة التحميل -->
        <div class="text-center mb-6">
            <label class="block p-4 border-2 border-dashed border-gray-600 rounded-lg cursor-pointer hover:border-blue-500">
                <span class="text-gray-300 text-lg">اختر صورة</span>
                <input type="file" id="uploadInput" accept="image/*" class="hidden">
            </label>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <!-- اللون المراد تغييره -->
            <div class="bg-gray-700 p-4 rounded-lg">
                <h3 class="text-lg mb-3">اللون المراد تغييره:</h3>
                <div class="grid gap-2">
                    <div>
                        <label class="block text-sm mb-1">Red</label>
                        <input type="number" id="oldRed" min="0" max="255" value="0">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Green</label>
                        <input type="number" id="oldGreen" min="0" max="255" value="0">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Blue</label>
                        <input type="number" id="oldBlue" min="0" max="255" value="0">
                    </div>
                </div>
            </div>

            <!-- اللون الجديد -->
            <div class="bg-gray-700 p-4 rounded-lg">
                <h3 class="text-lg mb-3">اللون الجديد:</h3>
                <div class="grid gap-2">
                    <div>
                        <label class="block text-sm mb-1">Red</label>
                        <input type="number" id="newRed" min="0" max="255" value="0">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Green</label>
                        <input type="number" id="newGreen" min="0" max="255" value="0">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Blue</label>
                        <input type="number" id="newBlue" min="0" max="255" value="0">
                    </div>
                </div>
            </div>
        </div>

        <!-- حساسية التغيير -->
        <div class="mt-4">
            <label class="block text-sm mb-1">حساسية التغيير (1-255)</label>
            <input type="number" id="tolerance" min="1" max="255" value="30" 
                   class="w-full bg-gray-700 rounded p-2 text-white">
        </div>

        <!-- منطقة العرض -->
        <div id="previewArea" class="text-center mt-6"></div>
    </div>

    <script>
        let currentImage = null;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // تحديث الصورة عند تغيير أي قيمة
        const inputs = ['oldRed', 'oldGreen', 'oldBlue', 'newRed', 'newGreen', 'newBlue', 'tolerance'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if (currentImage) processImage();
            });
        });

        document.getElementById('uploadInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImage = new Image();
                    currentImage.onload = function() {
                        processImage();
                    };
                    currentImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function processImage() {
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.drawImage(currentImage, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // قراءة القيم من المدخلات
            const oldColor = {
                r: parseInt(document.getElementById('oldRed').value) || 0,
                g: parseInt(document.getElementById('oldGreen').value) || 0,
                b: parseInt(document.getElementById('oldBlue').value) || 0
            };

            const newColor = {
                r: parseInt(document.getElementById('newRed').value) || 0,
                g: parseInt(document.getElementById('newGreen').value) || 0,
                b: parseInt(document.getElementById('newBlue').value) || 0
            };

            const tolerance = parseInt(document.getElementById('tolerance').value) || 30;

            // معالجة كل بكسل
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // التحقق من تطابق اللون مع الحساسية المحددة
                if (isColorSimilar(r, g, b, oldColor.r, oldColor.g, oldColor.b, tolerance)) {
                    data[i] = newColor.r;
                    data[i + 1] = newColor.g;
                    data[i + 2] = newColor.b;
                }
            }

            ctx.putImageData(imageData, 0, 0);
            
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = `
                <img src="${canvas.toDataURL()}" 
                     class="preview-image cursor-pointer" 
                     onclick="downloadImage()"
                     title="اضغط للتحميل">
            `;
        }

        function isColorSimilar(r1, g1, b1, r2, g2, b2, tolerance) {
            return Math.abs(r1 - r2) <= tolerance &&
                   Math.abs(g1 - g2) <= tolerance &&
                   Math.abs(b1 - b2) <= tolerance;
        }

        function downloadImage() {
            if (!currentImage) return;
            const link = document.createElement('a');
            link.download = 'edited-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>

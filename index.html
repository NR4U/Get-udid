<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الموقع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f4f4f4 0%, #e0e0e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loader-spin {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            animation: pulse 1.5s infinite;
        }

        .container {
            display: none;
            max-width: 800px;
            padding: 30px;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .container.show {
            transform: scale(1);
            opacity: 1;
        }

        .warning-sign {
            background: linear-gradient(45deg, #000 12%, #ffd700 12%, #ffd700 88%, #000 88%);
            border: 10px solid #000;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .warning-title {
            font-size: 54px;
            margin-bottom: 30px;
            color: #000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
        }

        .warning-text {
            font-size: 26px;
            margin-bottom: 30px;
            color: #000;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .new-link {
            display: inline-block;
            padding: 18px 40px;
            background: #000;
            color: #ffd700;
            text-decoration: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .new-link:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 215, 0, 0.2),
                transparent
            );
            animation: shine 3s infinite;
        }

        .new-link:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #111;
        }

        .icon-container {
            margin: 30px 0;
            position: relative;
            height: 60px;
        }

        .arrow-animation {
            position: relative;
            width: 200px;
            height: 40px;
            margin: 0 auto;
        }

        .arrow {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow::before {
            content: '';
            width: 40px;
            height: 40px;
            border: 5px solid #000;
            border-right: 0;
            border-bottom: 0;
            transform: rotate(135deg);
            animation: moveArrow 2s infinite;
        }

        @keyframes moveArrow {
            0% {
                opacity: 0;
                transform: rotate(135deg) translate(-20px, -20px);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: rotate(135deg) translate(20px, 20px);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .warning-title {
                font-size: 42px;
            }
            .warning-text {
                font-size: 20px;
            }
            .new-link {
                padding: 15px 30px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .warning-title {
                font-size: 36px;
            }
            .warning-text {
                font-size: 18px;
            }
            .new-link {
                padding: 12px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="loader-spin"></div>
        <div class="loader-text">⏳جاري التحميل...</div>
    </div>

    <div class="container">
        <div class="warning-sign">
            <div class="warning-title">⚠️ تنبيه</div>
            <div class="icon-container">
                <div class="arrow-animation">
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="warning-text">
                نعتذر على ازعاجك، لقد تم نقل متجرنا إلى موقع جديد.<br>
                نحن نعمل على تحسين تجربتك في التسوق!<br>
                يرجى زيارة المتجر الجديد من خلال الرابط أدناه
            </div>
            <a href="https://wolfshops.com" class="new-link">انتقل إلى الموقع الجديد</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.querySelector('.loader').style.opacity = '0';
                document.querySelector('.loader').style.transition = 'opacity 0.5s';
                setTimeout(function() {
                    document.querySelector('.loader').style.display = 'none';
                    document.querySelector('.container').style.display = 'block';
                    setTimeout(function() {
                        document.querySelector('.container').classList.add('show');
                    }, 100);
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
